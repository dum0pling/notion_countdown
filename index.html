<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <title>D-Day Counter</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            width: 100%;
            height: 100%;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #timer {
            position: relative;
            overflow: hidden; /* 블러 처리된 배경이 둥근 모서리 밖으로 삐져나오지 않게 고정 */
            border-radius: 20px;
            width: 380px;
            max-width: 95vw;
            height: 140px;
            text-align: center;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 10px;
            box-shadow: none !important;
        }

        /* 배경 이미지만 은은하게 블러 처리하는 레이어 */
        #timer::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("https://i.pinimg.com/564x/93/bf/8f/93bf8fa0999583b6324b1754054fa89a.jpg");
            background-size: cover;
            background-position: center;
            filter: blur(4px); /* ★ 흐림 정도 조절 (더 흐리게: 6px, 덜 흐리게: 2px) */
            transform: scale(1.08); /* 블러 시 가장자리 하얗게 뜨는 현상 방지 */
            z-index: 0;
        }

        /* 일, 시, 분, 초 블록 스타일 (갈색 글자) */
        .time-block {
            position: relative;
            z-index: 1; /* 블러된 배경 위로 올리기 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 75px;
            font-family: 'Nunito', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #6B4423; /* 따뜻한 미디엄 브라운 */
            text-shadow: 0px 0px 8px rgba(255, 255, 255, 0.9), 0px 0px 3px rgba(255, 255, 255, 0.9); 
        }

        /* 숫자 스타일 (진한 갈색 글자) */
        .numbers {
            font-family: 'Abril Fatface', cursive;
            letter-spacing: -0.03em;
            color: #4E2E18; /* 깊이감 있는 다크 브라운 */
            font-size: 40px;
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.95), 0px 0px 4px rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body>
    
<div id="timer">
    <div class="time-block"> 
        <div id="days" class="numbers">0</div>days
    </div> 
    <div class="time-block"> 
        <div id="hours" class="numbers">0</div>hours
    </div> 
    <div class="time-block"> 
        <div id="minutes" class="numbers">0</div>minutes
    </div> 
    <div class="time-block"> 
        <div id="seconds" class="numbers">0</div>seconds
    </div> 
</div>

<script>
// 2025년 11월 23일 기준
const myDate = new Date('Nov 23, 2025 00:00:00');

let timer = setInterval(function() {
    const today = new Date().getTime();
    const diff = today - myDate.getTime();

    let days = Math.floor(diff / (1000 * 60 * 60 * 24));
    let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    let seconds = Math.floor((diff % (1000 * 60)) / 1000);

    if (diff < 0) {
        days = 0; hours = 0; minutes = 0; seconds = 0;
    }

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;
}, 1000);
</script>
</body>
</html>
