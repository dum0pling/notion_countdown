<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion D-Day Counter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root {
    --bg-color: #ffffff;        /* 위젯 기본 배경색 (투명하게 하려면 transparent) */
    --card-radius: 20px;       /* 모서리 라운딩 */
    --title-color: #573D2A;     /* 타이틀 글자 색상 */
    --count-color: #C2855D;     /* D-day 숫자 강조 색상 */
    --sub-color: #8C6A51;       /* 날짜 설명 글자 색상 */
  }

  * { 
    box-sizing: border-box; 
    /* 텍스트 파랗게 선택되는 드래그 방지 */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  /* 1. 사방 불필요한 여백 및 스크롤바 100% 제거 */
  html, body {
    margin: 0; 
    padding: 0;
    overflow: hidden !important;
    width: 100%;
    height: 100%;
    font-family: 'Nunito', 'Noto Sans KR', sans-serif;
    background-color: transparent; 
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 2. 메인 위젯 카너 (그림자 및 불필요 여백 없음) */
  #dday-card {
    position: relative;
    width: 320px;            /* 가로 크기 */
    height: 130px;           /* 세로 크기 */
    background-color: var(--bg-color);
    
    /* ★ 나중에 배경 이미지를 넣을 때 사용되는 설정 ★ */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    border-radius: var(--card-radius);
    box-shadow: none !important; /* 하단 그림자 완전 제거 */
    
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 15px;
    text-align: center;
  }

  /* ★ 나중에 배경 이미지를 넣었을 때 글씨가 잘 보이게 해주는 반투명 어두운 오버레이 ★ */
  #dday-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: var(--card-radius);
    background: rgba(255, 255, 255, 0.2); /* 필요 시 0.2 숫자로 조절 */
    z-index: 1;
    display: var(--overlay-display, none); /* 배경 이미지가 있을 때만 켜짐 */
  }

  .content-box {
    position: relative;
    z-index: 2;
  }

  /* 타이틀 (예: 최애 입덕일, 만난 지 등) */
  .title {
    font-size: 15px;
    font-weight: 700;
    color: var(--title-color);
    margin-bottom: 4px;
  }

  /* D-Day 숫자 메인 강조 */
  .count-days {
    font-size: 32px;
    font-weight: 800;
    color: var(--count-color);
    letter-spacing: -0.5px;
    margin: 2px 0;
  }

  /* 시작 기준일 날짜 표시 */
  .sub-date {
    font-size: 12px;
    font-weight: 600;
    color: var(--sub-color);
    opacity: 0.85;
  }
</style>
</head>
<body>

<div id="dday-card">
  <div class="content-box">
    <div class="title" id="dday-title">❤️ 최애와 함께한 지 ❤️</div>
    <div class="count-days" id="dday-count">D+0</div>
    <div class="sub-date" id="dday-start-text">2024.01.01 ~</div>
  </div>
</div>

<script>
  // ==========================================
  // ⚙️ [위젯 설정하기]
  // ==========================================
  
  const CONFIG = {
    // 1. 카운트할 기준 날짜 (YYYY-MM-DD 형식)
    startDate: "2024-01-01",

    // 2. 타이틀 문구
    title: "❤️ 최애와 함께한 지 ❤️",

    // 3. 카운트 방식 선택 
    // "D+" : 오늘이 1일째부터 시작하는 지난 날짜 카운트 (덕질/커플 기념일용)
    // "D-" : 목표일까지 남은 디데이 카운트 (생일/콘서트/시험 목표일용)
    type: "D+",

    // 4. 나중에 배경 이미지를 바꾸고 싶을 때 아래 따옴표 안에 이미지 주소를 넣으세요!
    // 예시: "https://example.com/my-photo.jpg" (없으면 "" 빈값으로 두면 됩니다)
    bgImageUrl: "" 
  };

  // ==========================================
  // 🚀 카운트 자동 계산 로직
  // ==========================================
  function calculateDDay() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const targetDate = new Date(CONFIG.startDate);
    targetDate.setHours(0, 0, 0, 0);

    const diffTime = today.getTime() - targetDate.getTime();
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    const titleEl = document.getElementById("dday-title");
    const countEl = document.getElementById("dday-count");
    const subTextEl = document.getElementById("dday-start-text");
    const cardEl = document.getElementById("dday-card");

    titleEl.innerText = CONFIG.title;

    if (CONFIG.type === "D+") {
      // D+1부터 카운트 (만난 당일 = 1일)
      const count = diffDays >= 0 ? diffDays + 1 : 0;
      countEl.innerText = `D+${count}`;
      subTextEl.innerText = `${CONFIG.startDate.replace(/-/g, '.')} ~`;
    } else {
      // D-Day 남은 날짜 카운트
      const remaining = -diffDays;
      if (remaining > 0) {
        countEl.innerText = `D-${remaining}`;
      } else if (remaining === 0) {
        countEl.innerText = `D-DAY`;
      } else {
        countEl.innerText = `D+${Math.abs(remaining)}`;
      }
      subTextEl.innerText = `목표일: ${CONFIG.startDate.replace(/-/g, '.')}`;
    }

    // 배경 이미지 설정 처리
    if (CONFIG.bgImageUrl && CONFIG.bgImageUrl.trim() !== "") {
      cardEl.style.backgroundImage = `url('${CONFIG.bgImageUrl}')`;
      cardEl.style.setProperty('--overlay-display', 'block');
      
      // 배경사진이 들어갔을 때 글씨가 잘 보이도록 흰색으로 자동 변경
      document.documentElement.style.setProperty('--title-color', '#ffffff');
      document.documentElement.style.setProperty('--count-color', '#ffffff');
      document.documentElement.style.setProperty('--sub-color', '#f0f0f0');
    }
  }

  calculateDDay();
</script>

</body>
</html>
